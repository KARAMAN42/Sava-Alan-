<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Savaş Alanı - Birim Referansı</title>
    <style>
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00eaff;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #00eaff;
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
        }

        canvas {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .name {
            font-weight: bold;
            color: #4ecca3;
            margin-bottom: 5px;
        }

        .role {
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>

<body>

    <h1>Kuleler</h1>
    <div class="grid-container" id="towers-grid"></div>

    <h1>Düşmanlar</h1>
    <div class="grid-container" id="enemies-grid"></div>

    <!-- Mock Nesneleri -->
    <script>
        const game = {
            money: 1000,
            projectiles: [],
            particles: [],
            enemies: [],
            addFloatingText: () => { }
        };
        const audio = {
            playShoot: () => { },
            playHit: () => { },
            playExplosion: () => { }
        };
        class Particle { constructor() { } update() { } draw() { } }
    </script>

    <!-- Oyun Sınıflarını Yükle -->
    <script src="js/projectile.js"></script>
    <script src="js/tower.js"></script>
    <script src="js/enemy.js"></script>

    <script>
        const towers = [
            { type: 'standard', name: 'Standart', role: 'Temel Hasar' },
            { type: 'sniper', name: 'Nişancı', role: 'Uzun Menzil / Yüksek Hasar' },
            { type: 'rapid', name: 'Seri Atış', role: 'Hızlı Atış / Düşük Hasar' },
            { type: 'tesla', name: 'Tesla', role: 'Yavaşlatma / Zincirleme' },
            { type: 'plasma', name: 'Plazma', role: 'Alan Hasarı' }
        ];

        const enemies = [
            { type: 'normal', name: 'Asker Karınca', role: 'Temel Birim' },
            { type: 'fast', name: 'Yelpaze Kanat', role: 'Hızlı / Zayıf' },
            { type: 'tank', name: 'Mavi Böcek', role: 'Ağır Zırh' },
            { type: 'heavy', name: 'Gergedan', role: 'Çok Dayanıklı' },
            { type: 'scout', name: 'Gözcü', role: 'Hızlı Keşif' },
            { type: 'mantis', name: 'Mantis', role: 'Savaşçı' },
            { type: 'fly', name: 'Sinek', role: 'Sürü Birimi' },
            { type: 'boss', name: 'Kraliçe', role: 'BÖLÜM SONU CANAVARI' }
        ];

        function createCard(containerId, item, isTower) {
            const container = document.getElementById(containerId);
            const card = document.createElement('div');
            card.className = 'card';

            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');

            ctx.save();
            ctx.translate(50, 50);

            if (isTower) {
                const t = new Tower(0, 0, item.type);
                t.recoil = 0;
                t.draw(ctx);
            } else {
                const e = new Enemy([], item.type);
                e.draw(ctx);
            }

            ctx.restore();

            card.appendChild(canvas);

            const name = document.createElement('div');
            name.className = 'name';
            name.innerText = item.name;
            card.appendChild(name);

            const role = document.createElement('div');
            role.className = 'role';
            role.innerText = item.role;
            card.appendChild(role);

            container.appendChild(card);
        }

        towers.forEach(t => createCard('towers-grid', t, true));
        enemies.forEach(e => createCard('enemies-grid', e, false));

    </script>
</body>

</html>
